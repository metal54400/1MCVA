<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />

  tailwind.config = {

          paper: '#F7F4EC', ink: '#1E2A3A', inksoft: '#586274', line: '#DAD3C0', card: '#FFFEFB',

      },
    },

</script>
<style>
  body, div, header, footer, button, input { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease; }
  body { background-color: #F7F4EC; -webkit-tap-highlight-color: transparent; }
  ::selection { background: #2F6F5E; color: #FFFEFB; }
  
  .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
  
  .stagger-item { opacity: 0; animation: slideUp 0.4s ease-out forwards; }
  .stagger-item:nth-child(1) { animation-delay: 0.05s; }
  .stagger-item:nth-child(2) { animation-delay: 0.1s; }
  .stagger-item:nth-child(3) { animation-delay: 0.15s; }
  .stagger-item:nth-child(n+4) { animation-delay: 0.2s; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .drop-zone { border: 2px dashed #DAD3C0; transition: all 0.3s ease; }
  .drop-zone.drag-over { border-color: #2F6F5E; background-color: #E4EEE9; transform: scale(1.02); box-shadow: 0 0 20px rgba(47, 111, 94, 0.2); }
  
  .btn-touch { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #DAD3C0; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #2F6F5E; }
  .dark ::-webkit-scrollbar-thumb { background: #333; }
</style>
</head>
<body class="font-sans text-ink min-h-screen flex flex-col dark:bg-dark-bg dark:text-dark-text overflow-x-hidden">

<div id="app" class="flex-1 flex flex-col"></div>

<script>
/* ============================================================
   GESTION DU THÈME
   ============================================================ */
function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (savedTheme === 'dark' || (!savedTheme && systemDark)) document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}
function toggleTheme() {
  const html = document.documentElement;
  if (html.classList.contains('dark')) {
    html.classList.remove('dark');
    localStorage.setItem('theme', 'light');
  } else {
    html.classList.add('dark');
    localStorage.setItem('theme', 'dark');
  }
  render();
}
initTheme();

/* ============================================================
   CONFIGURATION & STATE
   ============================================================ */
const CONFIG = {
  classTitle: "Portail Documents",
  className: "1MCVA",
  githubOwner: "metal54400", 
  githubRepo: "1MCVA",
  githubBranch: "main",
  filesFolder: "files",
  manifestPath: "manifest.json",
  maxFileMB: 20,
  defaultCategories: ["Cours", "Diapositives", "TD / TP", "Examens", "Annonces", "Autres"],
};

let state = {
  isAdmin: false,
  githubToken: "",
  documents: [],
  manifestSha: null,
  search: "",
  activeCategory: "Tous",
  loading: true,
  uploading: false,
  uploadStats: { current: 0, total: 0, errors: [] },
  error: null,
  showLogin: false,
  loginError: null,
  isDragging: false,
  // Nouveau state pour la pré-upload
  pendingFiles: null,
  selectedCategory: "Cours",
};

const root = document.getElementById('app');
const RAW_BASE = `https://raw.githubusercontent.com/${CONFIG.githubOwner}/${CONFIG.githubRepo}/${CONFIG.githubBranch}`;
const API_BASE = `https://api.github.com/repos/${CONFIG.githubOwner}/${CONFIG.githubRepo}/contents`;

/* ============================================================
   UTILITAIRES
   ============================================================ */
function esc(str) { const d = document.createElement('div'); d.innerText = str ?? ""; return d.innerHTML; }
function humanSize(bytes) {
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " Ko";
  return (bytes / (1024 * 1024)).toFixed(1) + " Mo";
}
function formatDate(iso) { return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }); }
function extOf(name) { const p = name.split('.'); return p.length > 1 ? p.pop().toUpperCase() : "FILE"; }
function extColor(ext) {
  const map = { PDF:"rust", DOC:"teal", DOCX:"teal", ODT:"teal", PPT:"rust", PPTX:"rust", ODP:"rust", XLS:"gold", XLSX:"gold", ZIP:"inksoft", JPG:"gold", PNG:"gold" };
  return map[ext] || "inksoft";
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function safeName(name) { return name.replace(/[^a-zA-Z0-9._-]/g, '_'); }
function bufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(binary);
}

/* ============================================================
   TÉLÉCHARGEMENT UNIVERSEL
   ============================================================ */
async function forceDownload(url, filename) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Network response was not ok');
    const blob = await response.blob();
    const blobUrl = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(blobUrl);
    document.body.removeChild(a);
  } catch (error) {
    window.open(url, '_blank');
  }
}

/* ============================================================
   API GITHUB
   ============================================================ */
async function apiRequest(endpoint, options = {}) {
  const headers = { 'Accept': 'application/vnd.github.v3+json', ...options.headers };
  if (state.githubToken) headers['Authorization'] = `token ${state.githubToken}`;
  const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.message || `HTTP ${response.status}`);
  }
  if (response.status === 204) return null;
  return response.json();
}

async function loadManifest() {
  try {
    const data = await apiRequest(`/${CONFIG.manifestPath}`);
    state.manifestSha = data.sha;
    return JSON.parse(atob(data.content));
  } catch (e) { if (e.message.includes('404')) return []; throw e; }
}

async function saveManifest(documents) {
  const content = btoa(JSON.stringify(documents, null, 2));
  await apiRequest(`/${CONFIG.manifestPath}`, {
    method: 'PUT',
    body: JSON.stringify({ message: 'Update manifest', content, sha: state.manifestSha })
  });
  const data = await apiRequest(`/${CONFIG.manifestPath}`);
  state.manifestSha = data.sha;
}

async function uploadFileToGitHub(file, path) {
  const buffer = await file.arrayBuffer();
  return apiRequest(`/${path}`, {
    method: 'PUT',
    body: JSON.stringify({ message: `Upload: ${file.name}`, content: bufferToBase64(buffer) })
  });
}

async function deleteFileFromGitHub(path, sha) {
  await apiRequest(`/${path}`, { method: 'DELETE', body: JSON.stringify({ message: `Delete: ${path}`, sha }) });
}

/* ============================================================
   LOGIQUE MÉTIER
   ============================================================ */
async function loadDocuments() {
  state.loading = true; state.error = null; render();
  try {
    state.documents = (await loadManifest()).sort((a, b) => new Date(b.date) - new Date(a.date));
  } catch (e) { state.error = `Erreur: ${e.message}`; state.documents = []; }
  finally { state.loading = false; render(); }
}

// Déclenche la modale au lieu d'uploader directement
function prepareUpload(files) {
  if (!files || files.length === 0) return;
  state.pendingFiles = files;
  state.selectedCategory = state.activeCategory === 'Tous' ? 'Cours' : state.activeCategory;
  render();
}

// Lance l'upload réel après validation dans la modale
async function confirmUpload() {
  if (!state.pendingFiles) return;
  
  const files = state.pendingFiles;
  const category = state.selectedCategory;
  
  state.pendingFiles = null; // Fermer la modale
  state.uploading = true;
  state.error = null;
  state.uploadStats = { current: 0, total: files.length, errors: [] };
  render();

  const batchSize = 5;
  for (let i = 0; i < files.length; i += batchSize) {
    const batch = Array.from(files).slice(i, i + batchSize);
    
    await Promise.all(batch.map(async (file) => {
      try {
        if (file.size > CONFIG.maxFileMB * 1024 * 1024) throw new Error("Trop lourd");

        const safeFileName = safeName(file.name);
        const filePath = `${CONFIG.filesFolder}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safeFileName}`;

        await uploadFileToGitHub(file, filePath);
        
        state.documents.unshift({
          id: genId(),
          name: file.name,
          path: filePath,
          size: file.size,
          type: file.type,
          category: category, // Utilisation de la catégorie choisie
          date: new Date().toISOString(),
          uploadedBy: 'Admin'
        });
      } catch (err) {
        state.uploadStats.errors.push(`${file.name}: ${err.message}`);
      } finally {
        state.uploadStats.current++;
        render();
      }
    }));
  }

  if (state.documents.length > 0) await saveManifest(state.documents);
  
  if (state.uploadStats.errors.length > 0) {
    state.error = `${state.uploadStats.errors.length} échecs.`;
  }

  state.uploading = false;
  render();
}

async function deleteDocument(docId) {
  if (!confirm('Supprimer ce document ?')) return;
  const idx = state.documents.findIndex(d => d.id === docId);
  if (idx === -1) return;
  const doc = state.documents[idx];
  try {
    const fileData = await apiRequest(`/${doc.path}`);
    await deleteFileFromGitHub(doc.path, fileData.sha);
    state.documents.splice(idx, 1);
    await saveManifest(state.documents);
  } catch (e) { state.error = `Erreur suppression: ${e.message}`; render(); }
}

function handleLogin(token) {
  if (!token) { state.loginError = 'Token requis'; render(); return; }
  state.githubToken = token; state.isAdmin = true; state.showLogin = false; state.loginError = null;
  loadDocuments();
}

function handleLogout() {
  state.isAdmin = false;
  state.githubToken = "";
  state.showLogin = false;
  render();
}

/* ============================================================
   DRAG & DROP
   ============================================================ */
function handleDragOver(e) { e.preventDefault(); state.isDragging = true; render(); }
function handleDragLeave(e) { e.preventDefault(); state.isDragging = false; render(); }
function handleDrop(e) {
  e.preventDefault(); state.isDragging = false; render();
  if (!state.isAdmin) { state.error = "Mode Admin requis."; render(); return; }
  prepareUpload(e.dataTransfer.files);
}

/* ============================================================
   RENDU UI
   ============================================================ */
function render() {
  const isDark = document.documentElement.classList.contains('dark');
  const filteredDocs = state.documents.filter(doc => {
    const matchCat = state.activeCategory === 'Tous' || doc.category === state.activeCategory;
    const matchSearch = !state.search || doc.name.toLowerCase().includes(state.search.toLowerCase());
    return matchCat && matchSearch;
  });

  root.innerHTML = `
    <header class="bg-card/90 backdrop-blur-md border-b border-line sticky top-0 z-30 shadow-sm dark:bg-dark-card/90 dark:border-dark-line dark:text-dark-text animate-fade-in">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-teal rounded-lg flex items-center justify-center text-white shadow-lg shadow-teal/30">
            <i class="fa-solid fa-folder-open text-xl"></i>
          </div>
          <div>
            <h1 class="font-display text-xl sm:text-2xl font-bold text-ink dark:text-dark-text leading-tight">${esc(CONFIG.classTitle)}</h1>
            <p class="text-inksoft dark:text-dark-soft text-xs sm:text-sm font-medium">${esc(CONFIG.className)}</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleTheme()" class="btn-touch w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition focus-ring text-ink dark:text-dark-text relative overflow-hidden group" title="Changer le thème">
            <i class="fa-solid ${isDark ? 'fa-sun' : 'fa-moon'} absolute inset-0 flex items-center justify-center transition-transform duration-500 group-hover:rotate-180"></i>
          </button>
          <button onclick="${state.isAdmin ? 'handleLogout()' : 'state.showLogin=true;render()'}" 
            class="btn-touch px-4 py-2 rounded-lg transition-all duration-300 focus-ring text-sm font-medium shadow-md hover:shadow-lg hover:-translate-y-0.5 ${state.isAdmin ? 'bg-rust text-white hover:bg-rust-dark' : 'bg-teal text-white hover:bg-teal-dark'}">
            <i class="fa-solid ${state.isAdmin ? 'fa-right-from-bracket' : 'fa-user-shield'} mr-2"></i>
            ${state.isAdmin ? 'Quitter' : 'Admin'}
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full animate-slide-up" 
      ondragover="handleDragOver(event)" 
      ondragleave="handleDragLeave(event)" 
      ondrop="handleDrop(event)">
      
      ${state.error ? `<div class="mb-6 p-4 bg-rust-light border border-rust/30 text-rust rounded-xl text-sm shadow-sm animate-slide-up"><i class="fa-solid fa-circle-exclamation mr-2"></i>${esc(state.error)}</div>` : ''}

      <div class="mb-8 space-y-6">
        <div class="flex flex-col sm:flex-row gap-4">
          <div class="relative flex-1 group">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-inksoft dark:text-dark-soft transition-colors group-focus-within:text-teal"></i>
            <input type="text" placeholder="Rechercher un document..." value="${esc(state.search)}"
              oninput="state.search=this.value;render()"
              class="w-full pl-12 pr-4 py-3.5 border border-line rounded-xl bg-card focus-ring text-sm sm:text-base dark:bg-dark-card dark:border-dark-line dark:text-dark-text dark:placeholder-gray-500 shadow-sm hover:shadow-md transition-all duration-300" />
          </div>
          
          ${state.isAdmin ? `
            <label class="btn-touch px-6 py-3.5 bg-teal text-white rounded-xl hover:bg-teal-dark transition-all duration-300 cursor-pointer focus-ring inline-flex items-center justify-center gap-2 text-sm font-medium whitespace-nowrap shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95">
              <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
              <span>Ajouter des fichiers</span>
              <input type="file" multiple onchange="prepareUpload(this.files)" class="hidden"/>
            </label>
          ` : ''}
        </div>

        <div class="flex overflow-x-auto pb-2 gap-2 no-scrollbar mask-linear-fade">
          <button onclick="state.activeCategory='Tous';render()"
            class="px-5 py-2.5 rounded-full text-sm transition-all duration-300 focus-ring whitespace-nowrap shadow-sm hover:shadow-md hover:-translate-y-0.5 ${state.activeCategory==='Tous' ? 'bg-teal text-white font-semibold' : 'bg-card border border-line text-inksoft dark:bg-dark-card dark:border-dark-line dark:text-dark-soft'}">
            <i class="fa-solid fa-layer-group mr-1.5"></i> Tous
          </button>
          ${CONFIG.defaultCategories.map(cat => `
            <button onclick="state.activeCategory='${esc(cat)}';render()"
              class="px-5 py-2.5 rounded-full text-sm transition-all duration-300 focus-ring whitespace-nowrap shadow-sm hover:shadow-md hover:-translate-y-0.5 ${state.activeCategory===cat ? 'bg-teal text-white font-semibold' : 'bg-card border border-line text-inksoft dark:bg-dark-card dark:border-dark-line dark:text-dark-soft'}">${esc(cat)}</button>
          `).join('')}
        </div>
      </div>

      ${state.isAdmin && state.isDragging ? `
        <div class="drop-zone drag-over rounded-2xl p-16 mb-8 text-center flex flex-col items-center justify-center bg-teal-light/30 border-teal border-2 dark:bg-teal-dark/20 animate-fade-in">
          <div class="w-20 h-20 bg-teal/10 rounded-full flex items-center justify-center mb-4 animate-bounce-slow">
            <i class="fa-solid fa-cloud-arrow-up text-4xl text-teal"></i>
          </div>
          <p class="text-xl font-bold text-teal mb-1">Relâchez pour uploader</p>
        </div>
      ` : ''}

      ${state.uploading ? `
        <div class="mb-8 p-6 bg-card border border-line rounded-2xl shadow-lg rise dark:bg-dark-card dark:border-dark-line animate-slide-up">
          <div class="flex justify-between items-center mb-3">
            <span class="font-bold text-teal flex items-center gap-2"><i class="fa-solid fa-spinner fa-spin"></i> Traitement en cours...</span>
            <span class="text-inksoft dark:text-dark-soft font-mono bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded text-xs">${state.uploadStats.current} / ${state.uploadStats.total}</span>
          </div>
          <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
            <div class="bg-gradient-to-r from-teal to-teal-dark h-3 rounded-full transition-all duration-500 ease-out" style="width: ${(state.uploadStats.current / state.uploadStats.total) * 100}%"></div>
          </div>
        </div>
      ` : ''}

      ${state.loading ? `
        <div class="flex flex-col justify-center items-center py-32 animate-pulse">
          <div class="w-16 h-16 border-4 border-teal/30 border-t-teal rounded-full spin mb-4"></div>
          <p class="text-inksoft dark:text-dark-soft font-medium">Chargement des documents...</p>
        </div>` : 
        filteredDocs.length === 0 ? `
          <div class="text-center py-24 text-inksoft dark:text-dark-soft bg-card rounded-2xl border-2 border-dashed border-line dark:bg-dark-card dark:border-dark-line animate-fade-in">
            <div class="w-20 h-20 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fa-regular fa-folder-open text-3xl opacity-50"></i>
            </div>
            <p class="text-lg font-medium">Aucun document trouvé</p>
          </div>` :
          `<div class="grid gap-4">
            ${filteredDocs.map((doc, index) => {
              const ext = extOf(doc.name);
              const color = extColor(ext);
              const rawUrl = `${RAW_BASE}/${doc.path}`;
              
              let iconClass = "fa-file";
              if (['PDF'].includes(ext)) iconClass = "fa-file-pdf";
              else if (['DOC','DOCX','ODT'].includes(ext)) iconClass = "fa-file-word";
              else if (['XLS','XLSX'].includes(ext)) iconClass = "fa-file-excel";
              else if (['PPT','PPTX','ODP'].includes(ext)) iconClass = "fa-file-powerpoint";
              else if (['JPG','PNG','JPEG'].includes(ext)) iconClass = "fa-file-image";
              else if (['ZIP','RAR'].includes(ext)) iconClass = "fa-file-zipper";

              return `
                <div class="stagger-item bg-card border border-line rounded-2xl p-5 hover-lift group flex flex-col sm:flex-row sm:items-center justify-between gap-4 dark:bg-dark-card dark:border-dark-line" style="animation-delay: ${index * 0.05}s">
                  <div class="flex-1 min-w-0 flex items-start gap-5">
                    <div class="shrink-0 mt-1 relative">
                      <div class="flex items-center justify-center w-14 h-14 rounded-xl bg-${color}-light text-${color} text-2xl shadow-sm dark:bg-opacity-20 transition-transform duration-300 group-hover:scale-110">
                        <i class="fa-solid ${iconClass}"></i>
                      </div>
                    </div>
                    <div class="min-w-0 pt-1">
                      <h3 class="font-bold text-lg text-ink truncate pr-4 dark:text-dark-text mb-1" title="${esc(doc.name)}">${esc(doc.name)}</h3>
                      <div class="flex flex-wrap items-center gap-3 text-xs text-inksoft dark:text-dark-soft font-medium">
                        <span class="px-2.5 py-1 bg-gray-100 rounded-md text-gray-600 dark:bg-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600">${esc(doc.category)}</span>
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-hard-drive text-[10px]"></i>${humanSize(doc.size)}</span>
                        <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                        <span class="flex items-center gap-1.5"><i class="fa-regular fa-calendar text-[10px]"></i>${formatDate(doc.date)}</span>
                      </div>
                    </div>
                  </div>
                  
                  <div class="flex items-center gap-3 shrink-0 self-end sm:self-auto mt-2 sm:mt-0">
                    <button onclick="forceDownload('${rawUrl}', '${esc(doc.name).replace(/'/g, "\\'")}')" 
                      class="btn-touch px-5 py-2.5 bg-teal text-white rounded-xl hover:bg-teal-dark transition-all duration-300 focus-ring text-sm font-bold shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 flex items-center gap-2.5">
                      <i class="fa-solid fa-download"></i>
                      <span>Télécharger</span>
                    </button>
                    
                    ${state.isAdmin ? `
                      <button onclick="deleteDocument('${doc.id}')" class="btn-touch w-10 h-10 bg-rust-light text-rust rounded-xl hover:bg-rust hover:text-white transition-all duration-300 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 sm:hover:shadow-lg dark:bg-opacity-20" title="Supprimer">
                        <i class="fa-solid fa-trash-can"></i>
                      </button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>`
      }
    </main>

    <!-- MODALE DE CONNEXION -->
    ${state.showLogin ? `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target===this){state.showLogin=false;render()}">
        <div class="bg-card rounded-2xl shadow-2xl max-w-md w-full p-8 rise border border-line dark:bg-dark-card dark:border-dark-line animate-slide-up">
          <div class="text-center mb-6">
            <div class="w-16 h-16 bg-teal-light text-teal rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-teal/20 dark:bg-opacity-20">
              <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="font-display text-2xl font-bold dark:text-dark-text">Connexion Admin</h2>
          </div>
          <div class="relative mb-6 group">
            <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-inksoft dark:text-dark-soft"></i>
            <input type="password" id="gh-token" placeholder="ghp_..." class="w-full pl-12 pr-4 py-4 border border-line rounded-xl focus-ring font-mono text-sm bg-paper dark:bg-gray-800 dark:border-dark-line dark:text-dark-text" />
          </div>
          <div class="flex gap-3">
            <button onclick="state.showLogin=false;render()" class="flex-1 btn-touch px-4 py-3.5 border border-line rounded-xl hover:bg-paper transition-all duration-300 text-sm font-medium dark:border-dark-line dark:hover:bg-gray-700 dark:text-dark-text">Annuler</button>
            <button onclick="handleLogin(document.getElementById('gh-token').value)" class="flex-1 btn-touch px-4 py-3.5 bg-teal text-white rounded-xl hover:bg-teal-dark transition-all duration-300 text-sm font-bold shadow-lg hover:shadow-xl hover:-translate-y-0.5">Connexion</button>
          </div>
        </div>
      </div>
    ` : ''}

    <!-- NOUVELLE MODALE DE SÉLECTION DE CATÉGORIE -->
    ${state.pendingFiles ? `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target===this){state.pendingFiles=null;render()}">
        <div class="bg-card rounded-2xl shadow-2xl max-w-lg w-full p-0 rise border border-line dark:bg-dark-card dark:border-dark-line animate-slide-up overflow-hidden flex flex-col max-h-[90vh]">
          
          <div class="p-6 border-b border-line dark:border-dark-line bg-gray-50 dark:bg-gray-800/50">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-10 h-10 bg-teal/10 text-teal rounded-lg flex items-center justify-center text-lg">
                <i class="fa-solid fa-tags"></i>
              </div>
              <h2 class="font-display text-xl font-bold dark:text-dark-text">Configuration Upload</h2>
            </div>
            <p class="text-sm text-inksoft dark:text-dark-soft">Vous allez importer <strong>${state.pendingFiles.length}</strong> fichier(s). Choisissez la catégorie :</p>
          </div>

          <div class="p-6 flex-1 overflow-y-auto">
            <label class="block text-sm font-medium text-ink dark:text-dark-text mb-3">Catégorie cible</label>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-6">
              ${CONFIG.defaultCategories.map(cat => `
                <button onclick="state.selectedCategory='${cat}';render()"
                  class="px-3 py-3 rounded-xl text-sm transition-all border ${state.selectedCategory === cat 
                    ? 'bg-teal text-white border-teal shadow-md transform scale-105' 
                    : 'bg-white border-line text-inksoft hover:border-teal/50 dark:bg-dark-card dark:border-dark-line dark:text-dark-soft'}">
                  ${esc(cat)}
                </button>
              `).join('')}
            </div>

            <label class="block text-sm font-medium text-ink dark:text-dark-text mb-2">Aperçu des fichiers</label>
            <div class="bg-gray-50 dark:bg-gray-800 rounded-xl p-3 max-h-40 overflow-y-auto border border-line dark:border-dark-line">
              <ul class="space-y-2">
                ${Array.from(state.pendingFiles).map(f => `
                  <li class="flex items-center gap-2 text-xs text-inksoft dark:text-dark-soft">
                    <i class="fa-regular fa-file text-teal"></i>
                    <span class="truncate flex-1">${esc(f.name)}</span>
                    <span class="font-mono opacity-70">${humanSize(f.size)}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          </div>

          <div class="p-6 border-t border-line dark:border-dark-line bg-gray-50 dark:bg-gray-800/50 flex gap-3">
            <button onclick="state.pendingFiles=null;render()" class="flex-1 btn-touch px-4 py-3 border border-line rounded-xl hover:bg-white transition-all duration-300 text-sm font-medium dark:border-dark-line dark:hover:bg-gray-700 dark:text-dark-text">Annuler</button>
            <button onclick="confirmUpload()" class="flex-1 btn-touch px-4 py-3 bg-teal text-white rounded-xl hover:bg-teal-dark transition-all duration-300 text-sm font-bold shadow-lg hover:shadow-xl hover:-translate-y-0.5 flex items-center justify-center gap-2">
              <i class="fa-solid fa-cloud-arrow-up"></i> Lancer l'upload
            </button>
          </div>
        </div>
      </div>
    ` : ''}
    
    <footer class="border-t border-line mt-auto py-8 text-center text-inksoft text-xs bg-card dark:bg-dark-card dark:border-dark-line dark:text-dark-soft animate-fade-in">
      <div class="flex items-center justify-center gap-2 mb-2">
        <i class="fa-brands fa-github text-lg"></i>
        <span class="font-semibold">Stockage via GitHub</span>
      </div>
      <p class="opacity-70">${esc(CONFIG.githubOwner)}/${esc(CONFIG.githubRepo)}</p>
    </footer>
  `;
}

loadDocuments();
</script>
</body>
</html>
