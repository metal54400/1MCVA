<html lang="fr">

  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          paper: '#F7F4EC', ink: '#1E2A3A', inksoft: '#586274', line: '#DAD3C0', card: '#FFFEFB',
          teal: { DEFAULT: '#2F6F5E', dark: '#234F43', light: '#E4EEE9' },

</script>
<style>
  /* =========================================
     CSS SPÉCIALISÉ PAR APPAREIL
     ========================================= */
  
  body, div, header, footer, button, input { 
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease; 
  }
  body { background-color: #F7F4EC; -webkit-tap-highlight-color: transparent; }
  ::selection { background: #2F6F5E; color: #FFFEFB; }
  
  .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
  
  .stagger-item { opacity: 0; animation: slideUp 0.4s ease-out forwards; }
  .stagger-item:nth-child(1) { animation-delay: 0.05s; }
  .stagger-item:nth-child(2) { animation-delay: 0.1s; }
  .stagger-item:nth-child(3) { animation-delay: 0.15s; }
  .stagger-item:nth-child(n+4) { animation-delay: 0.2s; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .drop-zone { border: 2px dashed #DAD3C0; transition: all 0.3s ease; }
  .drop-zone.drag-over { border-color: #2F6F5E; background-color: #E4EEE9; transform: scale(1.02); }
  
  .btn-touch { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #DAD3C0; border-radius: 4px; }
  .dark ::-webkit-scrollbar-thumb { background: #333; }

  /* --- MOBILE (< 768px) --- */
  @media (max-width: 767px) {
    .doc-card {
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      flex-direction: column;
    }
    .doc-icon-box {
      width: 3rem;
      height: 3rem;
      font-size: 1.25rem;
    }
    /* Bouton télécharger pleine largeur en bas sur mobile */
    .action-area {
      width: 100%;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--line-color, #DAD3C0);
      display: flex;
      gap: 0.5rem;
      flex-direction: row;
    }
    .download-btn {
      flex: 1;
      justify-content: center;
    }
    .admin-btn {
      width: 44px;
      flex-shrink: 0;
    }
    .category-badge {
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
    }
  }

  /* --- TABLETTE & PC (> 768px) --- */
  @media (min-width: 768px) {
    .doc-list-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 colonnes sur tablette/pc */
      gap: 1.5rem;
    }
    
    .doc-card {
      padding: 1.5rem;
      display: flex;
      flex-direction: row; /* Horizontal sur PC */
      align-items: flex-start;
      justify-content: space-between;
    }

    .doc-icon-box {
      width: 3.5rem;
      height: 3.5rem;
      font-size: 1.5rem;
      margin-right: 1rem;
    }

    .info-area {
      flex: 1;
      min-width: 0; /* Permet le truncate */
    }

    .action-area {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-left: 1rem;
      flex-shrink: 0;
      align-items: flex-end;
    }

    .download-btn {
      width: auto;
      white-space: nowrap;
    }
    
    .admin-actions-row {
      display: flex;
      gap: 0.5rem;
    }
  }
</style>
</head>
<body class="font-sans text-ink min-h-screen flex flex-col dark:bg-dark-bg dark:text-dark-text overflow-x-hidden">

<div id="app" class="flex-1 flex flex-col"></div>

<script>
/* ============================================================
   GESTION DU THÈME
   ============================================================ */
function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (savedTheme === 'dark' || (!savedTheme && systemDark)) document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
}
function toggleTheme() {
  const html = document.documentElement;
  if (html.classList.contains('dark')) {
    html.classList.remove('dark');
    localStorage.setItem('theme', 'light');
  } else {
    html.classList.add('dark');
    localStorage.setItem('theme', 'dark');
  }
  render();
}
initTheme();

/* ============================================================
   CONFIGURATION & STATE
   ============================================================ */
const CONFIG = {
  classTitle: "Portail Documents",
  className: "1MCVA",
  githubOwner: "metal54400", 
  githubRepo: "1MCVA",
  githubBranch: "main",
  filesFolder: "files",
  manifestPath: "manifest.json",
  maxFileMB: 20,
  defaultCategories: ["Cours", "Diapositives", "TD / TP", "Examens", "Annonces", "Autres"],
};

let state = {
  isAdmin: false,
  githubToken: "",
  documents: [],
  manifestSha: null,
  search: "",
  activeCategory: "Tous",
  loading: true,
  uploading: false,
  uploadStats: { current: 0, total: 0, errors: [] },
  error: null,
  showLogin: false,
  loginError: null,
  isDragging: false,
  pendingFiles: null,
  selectedCategories: [],
  updatingDocId: null,
};

const root = document.getElementById('app');
const RAW_BASE = `https://raw.githubusercontent.com/${CONFIG.githubOwner}/${CONFIG.githubRepo}/${CONFIG.githubBranch}`;
const API_BASE = `https://api.github.com/repos/${CONFIG.githubOwner}/${CONFIG.githubRepo}/contents`;

/* ============================================================
   UTILITAIRES
   ============================================================ */
function esc(str) { const d = document.createElement('div'); d.innerText = str ?? ""; return d.innerHTML; }
function humanSize(bytes) {
  if (bytes < 1024) return bytes + " o";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " Ko";
  return (bytes / (1024 * 1024)).toFixed(1) + " Mo";
}
function formatDate(iso) { return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }); }
function extOf(name) { const p = name.split('.'); return p.length > 1 ? p.pop().toUpperCase() : "FILE"; }
function extColor(ext) {
  const map = { PDF:"rust", DOC:"teal", DOCX:"teal", ODT:"teal", PPT:"rust", PPTX:"rust", ODP:"rust", XLS:"gold", XLSX:"gold", ZIP:"inksoft", JPG:"gold", PNG:"gold" };
  return map[ext] || "inksoft";
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function safeName(name) { return name.replace(/[^a-zA-Z0-9._-]/g, '_'); }
function bufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(binary);
}

/* ============================================================
   TÉLÉCHARGEMENT UNIVERSEL
   ============================================================ */
async function forceDownload(url, filename) {
  try {
    const btn = event.currentTarget;
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    btn.disabled = true;
    
    const response = await fetch(url);
    if (!response.ok) throw new Error('Network response was not ok');
    
    const blob = await response.blob();
    const blobUrl = window.URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    
    setTimeout(() => {
      window.URL.revokeObjectURL(blobUrl);
      document.body.removeChild(a);
      btn.innerHTML = originalHTML;
      btn.disabled = false;
    }, 2000);
    
  } catch (error) {
    console.error('Download failed:', error);
    window.open(url, '_blank');
  }
}

/* ============================================================
   API GITHUB
   ============================================================ */
async function apiRequest(endpoint, options = {}) {
  const headers = { 'Accept': 'application/vnd.github.v3+json', ...options.headers };
  if (state.githubToken) headers['Authorization'] = `token ${state.githubToken}`;
  const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.message || `HTTP ${response.status}`);
  }
  if (response.status === 204) return null;
  return response.json();
}

async function loadManifest() {
  try {
    const data = await apiRequest(`/${CONFIG.manifestPath}`);
    state.manifestSha = data.sha;
    return JSON.parse(atob(data.content));
  } catch (e) { if (e.message.includes('404')) return []; throw e; }
}

async function saveManifest(documents) {
  const content = btoa(JSON.stringify(documents, null, 2));
  await apiRequest(`/${CONFIG.manifestPath}`, {
    method: 'PUT',
    body: JSON.stringify({ message: 'Update manifest', content, sha: state.manifestSha })
  });
  const data = await apiRequest(`/${CONFIG.manifestPath}`);
  state.manifestSha = data.sha;
}

async function uploadFileToGitHub(file, path) {
  const buffer = await file.arrayBuffer();
  return apiRequest(`/${path}`, {
    method: 'PUT',
    body: JSON.stringify({ message: `Upload/Update: ${file.name}`, content: bufferToBase64(buffer) })
  });
}

async function deleteFileFromGitHub(path, sha) {
  await apiRequest(`/${path}`, { method: 'DELETE', body: JSON.stringify({ message: `Delete: ${path}`, sha }) });
}

/* ============================================================
   LOGIQUE MÉTIER
   ============================================================ */
async function loadDocuments() {
  state.loading = true; state.error = null; render();
  try {
    state.documents = (await loadManifest()).sort((a, b) => new Date(b.date) - new Date(a.date));
  } catch (e) { state.error = `Erreur: ${e.message}`; state.documents = []; }
  finally { state.loading = false; render(); }
}

function prepareUpload(files) {
  if (!files || files.length === 0) return;
  state.pendingFiles = files;
  const defaultCat = (state.activeCategory !== 'Tous') ? [state.activeCategory] : [CONFIG.defaultCategories[0]];
  state.selectedCategories = defaultCat;
  render();
}

async function confirmUpload() {
  if (!state.pendingFiles) return;
  
  const files = state.pendingFiles;
  const categories = state.selectedCategories;
  
  state.pendingFiles = null;
  state.uploading = true;
  state.error = null;
  state.uploadStats = { current: 0, total: files.length, errors: [] };
  render();

  const batchSize = 5;
  for (let i = 0; i < files.length; i += batchSize) {
    const batch = Array.from(files).slice(i, i + batchSize);
    await Promise.all(batch.map(async (file) => {
      try {
        if (file.size > CONFIG.maxFileMB * 1024 * 1024) throw new Error("Trop lourd");
        const safeFileName = safeName(file.name);
        const filePath = `${CONFIG.filesFolder}/${Date.now()}_${Math.random().toString(36).slice(2)}_${safeFileName}`;
        await uploadFileToGitHub(file, filePath);
        
        state.documents.unshift({
          id: genId(),
          name: file.name,
          path: filePath,
          size: file.size,
          type: file.type,
          categories: categories,
          date: new Date().toISOString(),
          uploadedBy: 'Admin'
        });
      } catch (err) {
        state.uploadStats.errors.push(`${file.name}: ${err.message}`);
      } finally {
        state.uploadStats.current++;
        render();
      }
    }));
  }

  if (state.documents.length > 0) await saveManifest(state.documents);
  if (state.uploadStats.errors.length > 0) state.error = `${state.uploadStats.errors.length} échecs.`;
  state.uploading = false;
  render();
}

function prepareUpdate(docId) {
  state.updatingDocId = docId;
  render();
}

async function confirmUpdateFile(newFile) {
  if (!state.updatingDocId || !newFile) return;
  const docIndex = state.documents.findIndex(d => d.id === state.updatingDocId);
  if (docIndex === -1) return;
  const doc = state.documents[docIndex];
  
  state.uploading = true;
  state.error = null;
  render();

  try {
    await uploadFileToGitHub(newFile, doc.path);
    state.documents[docIndex].size = newFile.size;
    state.documents[docIndex].date = new Date().toISOString();
    await saveManifest(state.documents);
    state.updatingDocId = null;
    state.uploading = false;
    render();
  } catch (e) {
    state.error = `Erreur update: ${e.message}`;
    state.uploading = false;
    render();
  }
}

async function deleteDocument(docId) {
  if (!confirm('Supprimer ce document ?')) return;
  const idx = state.documents.findIndex(d => d.id === docId);
  if (idx === -1) return;
  const doc = state.documents[idx];
  try {
    const fileData = await apiRequest(`/${doc.path}`);
    await deleteFileFromGitHub(doc.path, fileData.sha);
    state.documents.splice(idx, 1);
    await saveManifest(state.documents);
  } catch (e) { state.error = `Erreur suppression: ${e.message}`; render(); }
}

function handleLogin(token) {
  if (!token) { state.loginError = 'Token requis'; render(); return; }
  state.githubToken = token; state.isAdmin = true; state.showLogin = false; state.loginError = null;
  loadDocuments();
}

function handleLogout() {
  state.isAdmin = false;
  state.githubToken = "";
  state.showLogin = false;
  render();
}

function toggleCategory(cat) {
  if (state.selectedCategories.includes(cat)) {
    state.selectedCategories = state.selectedCategories.filter(c => c !== cat);
  } else {
    state.selectedCategories.push(cat);
  }
  render();
}

/* ============================================================
   DRAG & DROP
   ============================================================ */
function handleDragOver(e) { e.preventDefault(); state.isDragging = true; render(); }
function handleDragLeave(e) { e.preventDefault(); state.isDragging = false; render(); }
function handleDrop(e) {
  e.preventDefault(); state.isDragging = false; render();
  if (!state.isAdmin) { state.error = "Mode Admin requis."; render(); return; }
  prepareUpload(e.dataTransfer.files);
}

/* ============================================================
   RENDU UI
   ============================================================ */
function render() {
  const isDark = document.documentElement.classList.contains('dark');
  const filteredDocs = state.documents.filter(doc => {
    const matchCat = state.activeCategory === 'Tous' || (doc.categories && doc.categories.includes(state.activeCategory));
    const matchSearch = !state.search || doc.name.toLowerCase().includes(state.search.toLowerCase());
    return matchCat && matchSearch;
  });

  root.innerHTML = `
    <header class="bg-card/90 backdrop-blur-md border-b border-line sticky top-0 z-30 shadow-sm dark:bg-dark-card/90 dark:border-dark-line dark:text-dark-text animate-fade-in">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-teal rounded-lg flex items-center justify-center text-white shadow-lg shadow-teal/30 shrink-0">
            <i class="fa-solid fa-folder-open text-xl"></i>
          </div>
          <div class="min-w-0">
            <h1 class="font-display text-lg sm:text-2xl font-bold text-ink dark:text-dark-text leading-tight truncate">${esc(CONFIG.classTitle)}</h1>
            <p class="text-inksoft dark:text-dark-soft text-xs font-medium">${esc(CONFIG.className)}</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button onclick="toggleTheme()" class="btn-touch w-10 h-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition focus-ring text-ink dark:text-dark-text" title="Thème">
            <i class="fa-solid ${isDark ? 'fa-sun' : 'fa-moon'}"></i>
          </button>
          <button onclick="${state.isAdmin ? 'handleLogout()' : 'state.showLogin=true;render()'}" 
            class="btn-touch px-3 py-2 rounded-lg transition-all duration-300 focus-ring text-sm font-medium shadow-md ${state.isAdmin ? 'bg-rust text-white' : 'bg-teal text-white'}">
            <i class="fa-solid ${state.isAdmin ? 'fa-right-from-bracket' : 'fa-user-shield'}"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-6 w-full animate-slide-up" 
      ondragover="handleDragOver(event)" 
      ondragleave="handleDragLeave(event)" 
      ondrop="handleDrop(event)">
      
      ${state.error ? `<div class="mb-6 p-4 bg-rust-light border border-rust/30 text-rust rounded-xl text-sm shadow-sm"><i class="fa-solid fa-circle-exclamation mr-2"></i>${esc(state.error)}</div>` : ''}

      <div class="mb-6 space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="relative flex-1 group">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-inksoft dark:text-dark-soft"></i>
            <input type="text" placeholder="Rechercher..." value="${esc(state.search)}"
              oninput="state.search=this.value;render()"
              class="w-full pl-10 pr-4 py-3 border border-line rounded-xl bg-card focus-ring text-sm dark:bg-dark-card dark:border-dark-line dark:text-dark-text shadow-sm" />
          </div>
          
          ${state.isAdmin ? `
            <label class="btn-touch px-4 py-3 bg-teal text-white rounded-xl hover:bg-teal-dark transition-all cursor-pointer focus-ring inline-flex items-center justify-center gap-2 text-sm font-medium whitespace-nowrap shadow-md active:scale-95">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>Ajouter</span>
              <input type="file" multiple onchange="prepareUpload(this.files)" class="hidden"/>
            </label>
          ` : ''}
        </div>

        <div class="flex overflow-x-auto pb-2 gap-2 no-scrollbar">
          <button onclick="state.activeCategory='Tous';render()"
            class="px-4 py-2 rounded-full text-sm transition-all whitespace-nowrap shadow-sm ${state.activeCategory==='Tous' ? 'bg-teal text-white font-semibold' : 'bg-card border border-line text-inksoft dark:bg-dark-card dark:border-dark-line dark:text-dark-soft'}">
            Tous
          </button>
          ${CONFIG.defaultCategories.map(cat => `
            <button onclick="state.activeCategory='${esc(cat)}';render()"
              class="px-4 py-2 rounded-full text-sm transition-all whitespace-nowrap shadow-sm ${state.activeCategory===cat ? 'bg-teal text-white font-semibold' : 'bg-card border border-line text-inksoft dark:bg-dark-card dark:border-dark-line dark:text-dark-soft'}">${esc(cat)}</button>
          `).join('')}
        </div>
      </div>

      ${state.uploading ? `
        <div class="mb-6 p-4 bg-card border border-line rounded-xl shadow-sm dark:bg-dark-card dark:border-dark-line">
          <div class="flex justify-between text-sm mb-2">
            <span class="font-bold text-teal"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Upload...</span>
            <span class="text-inksoft dark:text-dark-soft">${state.uploadStats.current}/${state.uploadStats.total}</span>
          </div>
          <div class="w-full bg-gray-100 dark:bg-gray-700 rounded-full h-2">
            <div class="bg-teal h-2 rounded-full transition-all" style="width: ${(state.uploadStats.current / state.uploadStats.total) * 100}%"></div>
          </div>
        </div>
      ` : ''}

      ${state.loading ? `
        <div class="flex flex-col justify-center items-center py-20 animate-pulse">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-teal mb-4"></i>
          <p class="text-inksoft dark:text-dark-soft">Chargement...</p>
        </div>` : 
        filteredDocs.length === 0 ? `
          <div class="text-center py-20 text-inksoft dark:text-dark-soft bg-card rounded-2xl border-2 border-dashed border-line dark:bg-dark-card dark:border-dark-line">
            <i class="fa-regular fa-folder-open text-4xl mb-4 opacity-50"></i>
            <p>Rien trouvé</p>
          </div>` :
          `<div class="doc-list-grid">
            ${filteredDocs.map((doc, index) => {
              const ext = extOf(doc.name);
              const color = extColor(ext);
              const rawUrl = `${RAW_BASE}/${doc.path}`;
              
              let iconClass = "fa-file";
              if (['PDF'].includes(ext)) iconClass = "fa-file-pdf";
              else if (['DOC','DOCX','ODT'].includes(ext)) iconClass = "fa-file-word";
              else if (['XLS','XLSX'].includes(ext)) iconClass = "fa-file-excel";
              else if (['PPT','PPTX','ODP'].includes(ext)) iconClass = "fa-file-powerpoint";
              else if (['JPG','PNG','JPEG'].includes(ext)) iconClass = "fa-file-image";
              else if (['ZIP','RAR'].includes(ext)) iconClass = "fa-file-zipper";

              const cats = doc.categories || (doc.category ? [doc.category] : ['Autres']);

              return `
                <div class="stagger-item doc-card bg-card border border-line hover-lift group dark:bg-dark-card dark:border-dark-line" style="animation-delay: ${index * 0.05}s">
                  
                  <!-- Icône -->
                  <div class="shrink-0 mt-1">
                    <div class="flex items-center justify-center doc-icon-box rounded-xl bg-${color}-light text-${color} shadow-sm dark:bg-opacity-20">
                      <i class="fa-solid ${iconClass}"></i>
                    </div>
                  </div>

                  <!-- Infos (Titre, Badges, Date) -->
                  <div class="info-area pt-1">
                    <h3 class="font-bold text-base sm:text-lg text-ink truncate pr-2 dark:text-dark-text mb-1" title="${esc(doc.name)}">${esc(doc.name)}</h3>
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                      ${cats.map(c => `<span class="category-badge px-2 py-0.5 bg-gray-100 rounded uppercase tracking-wide text-gray-600 dark:bg-gray-700 dark:text-gray-300">${esc(c)}</span>`).join('')}
                    </div>
                    <div class="flex items-center gap-3 text-xs text-inksoft dark:text-dark-soft">
                      <span><i class="fa-solid fa-hard-drive mr-1"></i>${humanSize(doc.size)}</span>
                      <span class="w-1 h-1 bg-gray-300 rounded-full"></span>
                      <span><i class="fa-regular fa-calendar mr-1"></i>${formatDate(doc.date)}</span>
                    </div>
                  </div>
                  
                  <!-- Zone d'Actions (Boutons) -->
                  <div class="action-area">
                    <button onclick="forceDownload('${rawUrl}', '${esc(doc.name).replace(/'/g, "\\'")}')" 
                      class="btn-touch download-btn bg-teal text-white rounded-lg hover:bg-teal-dark transition-all text-sm font-bold shadow-sm active:scale-95 flex items-center justify-center gap-2">
                      <i class="fa-solid fa-download"></i>
                      <span>Télécharger</span>
                    </button>
                    
                    ${state.isAdmin ? `
                      <div class="admin-actions-row">
                        <button onclick="prepareUpdate('${doc.id}')" class="btn-touch admin-btn bg-gold-light text-gold rounded-lg hover:bg-gold hover:text-white transition-all dark:bg-opacity-20" title="Mettre à jour">
                          <i class="fa-solid fa-rotate"></i>
                        </button>
                        <button onclick="deleteDocument('${doc.id}')" class="btn-touch admin-btn bg-rust-light text-rust rounded-lg hover:bg-rust hover:text-white transition-all dark:bg-opacity-20" title="Supprimer">
                          <i class="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                    ` : ''}
                  </div>

                </div>
              `;
            }).join('')}
          </div>`
      }
    </main>

    <!-- MODALE LOGIN -->
    ${state.showLogin ? `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target===this){state.showLogin=false;render()}">
        <div class="bg-card rounded-2xl shadow-2xl max-w-md w-full p-6 rise border border-line dark:bg-dark-card dark:border-dark-line">
          <h2 class="font-display text-xl font-bold mb-4 dark:text-dark-text">Connexion Admin</h2>
          <input type="password" id="gh-token" placeholder="Token GitHub..." class="w-full px-4 py-3 border border-line rounded-xl mb-4 focus-ring font-mono text-sm bg-paper dark:bg-gray-800 dark:border-dark-line dark:text-dark-text" />
          <div class="flex gap-3">
            <button onclick="state.showLogin=false;render()" class="flex-1 py-3 border border-line rounded-xl hover:bg-gray-50 dark:border-dark-line dark:hover:bg-gray-700 dark:text-dark-text">Annuler</button>
            <button onclick="handleLogin(document.getElementById('gh-token').value)" class="flex-1 py-3 bg-teal text-white rounded-xl font-bold shadow-lg">Connexion</button>
          </div>
        </div>
      </div>
    ` : ''}

    <!-- MODALE UPLOAD -->
    ${state.pendingFiles ? `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target===this){state.pendingFiles=null;render()}">
        <div class="bg-card rounded-2xl shadow-2xl max-w-lg w-full p-0 rise border border-line dark:bg-dark-card dark:border-dark-line animate-slide-up overflow-hidden flex flex-col max-h-[90vh]">
          <div class="p-4 border-b border-line dark:border-dark-line bg-gray-50 dark:bg-gray-800/50">
            <h2 class="font-display text-lg font-bold dark:text-dark-text">Nouveau Fichier</h2>
            <p class="text-xs text-inksoft dark:text-dark-soft">${state.pendingFiles.length} fichier(s) sélectionné(s)</p>
          </div>
          <div class="p-4 flex-1 overflow-y-auto">
            <label class="block text-sm font-medium text-ink dark:text-dark-text mb-2">Catégories</label>
            <div class="grid grid-cols-2 gap-2 mb-4">
              ${CONFIG.defaultCategories.map(cat => {
                const isSelected = state.selectedCategories.includes(cat);
                return `<button onclick="toggleCategory('${cat}')" class="px-3 py-2 rounded-lg text-xs border transition-all ${isSelected ? 'bg-teal text-white border-teal' : 'bg-white border-line text-inksoft dark:bg-dark-card dark:border-dark-line dark:text-dark-soft'}">${esc(cat)}</button>`;
              }).join('')}
            </div>
          </div>
          <div class="p-4 border-t border-line dark:border-dark-line bg-gray-50 dark:bg-gray-800/50 flex gap-3">
            <button onclick="state.pendingFiles=null;render()" class="flex-1 py-3 border border-line rounded-xl dark:border-dark-line dark:text-dark-text">Annuler</button>
            <button onclick="confirmUpload()" class="flex-1 py-3 bg-teal text-white rounded-xl font-bold shadow-lg">Uploader</button>
          </div>
        </div>
      </div>
    ` : ''}

    <!-- MODALE UPDATE -->
    ${state.updatingDocId ? `
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in" onclick="if(event.target===this){state.updatingDocId=null;render()}">
        <div class="bg-card rounded-2xl shadow-2xl max-w-md w-full p-6 rise border border-line dark:bg-dark-card dark:border-dark-line animate-slide-up">
          <h2 class="font-display text-xl font-bold mb-2 dark:text-dark-text">Mettre à jour</h2>
          <p class="text-sm text-inksoft dark:text-dark-soft mb-6">Choisissez le nouveau fichier pour remplacer l'ancien.</p>
          <label class="block w-full cursor-pointer border-2 border-dashed border-line rounded-xl p-6 text-center hover:bg-gray-50 dark:border-dark-line dark:hover:bg-gray-800">
            <input type="file" class="hidden" onchange="confirmUpdateFile(this.files[0])" />
            <i class="fa-solid fa-cloud-arrow-up text-2xl text-inksoft mb-2"></i>
            <p class="font-medium text-ink dark:text-dark-text">Sélectionner un fichier</p>
          </label>
          <div class="mt-6 flex justify-end">
             <button onclick="state.updatingDocId=null;render()" class="px-4 py-2 text-sm text-inksoft dark:text-dark-soft">Annuler</button>
          </div>
        </div>
      </div>
    ` : ''}
    
    <footer class="border-t border-line mt-auto py-6 text-center text-inksoft text-xs bg-card dark:bg-dark-card dark:border-dark-line dark:text-dark-soft">
      <p><i class="fa-brands fa-github mr-1"></i> ${esc(CONFIG.githubOwner)}/${esc(CONFIG.githubRepo)}</p>
    </footer>
  `;
}

loadDocuments();
</script>
</body>
</html>
