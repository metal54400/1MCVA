# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      # NOUVELLE ÉTAPE : Générer le manifest.json depuis le dossier files/
      - name: Generate File Manifest
        run: |
          mkdir -p files
          echo '[' > manifest.json
          first=true
          # Scanner récursivement le dossier files/
          find files -type f ! -name "*.md" | sort | while IFS= read -r file; do
            if [ "$first" = true ]; then
              first=false
            else
              echo ',' >> manifest.json
            fi
            
            # Récupérer la taille et la date
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
            mod_date=$(stat -c%Y "$file" 2>/dev/null || stat -f%m "$file" 2>/dev/null || echo "0")
            iso_date=$(date -d @"$mod_date" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -r "$mod_date" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ")")
            
            # Déterminer la catégorie par défaut (peut être ajusté)
            category="Autres"
            if [[ "$file" == *"cours"* || "$file" == *"course"* ]]; then category="Cours"; fi
            if [[ "$file" == *"td"* || "$file" == *"tp"* ]]; then category="TD / TP"; fi
            if [[ "$file" == *"exam"* || "$file" == *"ds"* ]]; then category="Examens"; fi
            
            # Écrire l'objet JSON
            cat <<EOF >> manifest.json
          {
            "id": "$(echo "$file" | md5sum | cut -d' ' -f1)",
            "name": "$(basename "$file")",
            "path": "$file",
            "size": $size,
            "categories": ["$category"],
            "date": "$iso_date",
            "uploadedBy": "System"
          }
          EOF
          done
          echo ']' >> manifest.json
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
